<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1급 한자 플래시카드</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    align-items: center;
    justify-items: center;
    background: #f2f2f4;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "Microsoft YaHei", sans-serif;
    color: #3f3f46;
    padding: 12px;
    height: 100vh;
    height: 100dvh;
    row-gap: 8px;
  }

  h1 {
    font-size: clamp(1.1rem, 4.6vw, 1.35rem);
    margin: 0;
    font-weight: 600;
    letter-spacing: 1px;
    font-family: "Noto Serif SC", "Songti SC", "Noto Serif CJK SC", "SimSun", "STSong", "Apple SD Gothic Neo", serif;
    color: #52525b;
  }

  .counter {
    margin-top: 8px;
    font-size: 0.9rem;
    color: #9a9aa2;
  }

  .bottom-area {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-area {
    text-align: center;
  }

  .card-wrap {
    perspective: 1600px;
    width: min(480px, 92vw);
    height: min(560px, 58vh);
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
    padding: 20px;
    text-align: center;
  }

  .front {
    background: #ffffff;
  }

  .hanzi {
    font-size: clamp(3.6rem, 22vw, 10rem);
    font-weight: 700;
    line-height: 1;
    font-family: "Noto Serif SC", "Songti SC", "Noto Serif CJK SC", "SimSun", "STSong", "Apple SD Gothic Neo", serif;
    color: #27272a;
  }

  .back {
    background: #ffffff;
    color: #27272a;
    transform: rotateY(180deg);
    gap: 14px;
  }

  .pinyin {
    font-size: clamp(1.3rem, 5.5vw, 2rem);
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #52525b;
  }

  .meaning {
    font-size: clamp(1.05rem, 4.6vw, 1.5rem);
    font-weight: 500;
    color: #3f3f46;
  }

  .hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.75rem;
    opacity: 0.5;
    color: #a1a1aa;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(6px, 2vw, 10px);
    margin-top: 4px;
  }

  button {
    border: none;
    border-radius: 12px;
    padding: clamp(9px, 2.6vw, 12px) clamp(12px, 4vw, 18px);
    font-size: clamp(0.8rem, 3.4vw, 0.95rem);
    font-weight: 600;
    cursor: pointer;
    background: #e4e4e7;
    color: #3f3f46;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  button:hover { background: #d4d4d8; }
  button:active { transform: scale(0.96); }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .flip-btn {
    background: #52525b;
    color: #fafafa;
  }
  .flip-btn:hover {
    background: #3f3f46;
  }

  .shuffle-btn {
    background: #e4e4e7;
  }
  .shuffle-btn:hover {
    background: #d4d4d8;
  }

  .mark-btn {
    background: #e4e4e7;
  }
  .mark-btn:hover {
    background: #d4d4d8;
  }
  .mark-btn.active {
    background: #d6c399;
    color: #4a3f24;
  }
  .mark-btn.active:hover {
    background: #c9b384;
  }

  .filter-btn {
    background: #e4e4e7;
  }
  .filter-btn:hover {
    background: #d4d4d8;
  }
  .filter-btn.active {
    background: #b9b9c6;
    color: #26262e;
  }
  .filter-btn.active:hover {
    background: #a9a9b8;
  }

  .star-badge {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 1.3rem;
    opacity: 0.85;
    display: none;
  }

  .star-badge.show {
    display: block;
  }
</style>
</head>
<body>

<div class="top-area">
  <h1>汉字卡片</h1>
</div>

<div class="card-wrap">
  <div class="card" id="card">
    <div class="face front">
      <div class="star-badge" id="starBadge">⭐</div>
      <div class="hanzi" id="hanzi">你</div>
      <div class="hint">카드를 클릭하면 뒤집혀요</div>
    </div>
    <div class="face back">
      <div class="pinyin" id="pinyin">nǐ</div>
      <div class="meaning" id="meaning">너, 당신</div>
      <div class="hint">다시 클릭하면 앞면으로</div>
    </div>
  </div>
</div>

<div class="bottom-area">
  <div class="controls">
    <button id="prevBtn">◀ 이전</button>
    <button id="flipBtn" class="flip-btn">뒤집기</button>
    <button id="nextBtn">다음 ▶</button>
  </div>
  <div class="controls">
    <button id="markBtn" class="mark-btn">☆ 어려워요</button>
    <button id="filterBtn" class="filter-btn">⭐ 어려운 카드만</button>
    <button id="shuffleBtn" class="shuffle-btn">🔀 섞기</button>
  </div>
  <div class="counter" id="counter">1 / 20</div>
</div>

<script>
  const words = [
    { hanzi: "你", pinyin: "nǐ", meaning: "너, 당신" },
    { hanzi: "我", pinyin: "wǒ", meaning: "나" },
    { hanzi: "他", pinyin: "tā", meaning: "그(남자)" },
    { hanzi: "好", pinyin: "hǎo", meaning: "좋다" },
    { hanzi: "是", pinyin: "shì", meaning: "~이다" },
    { hanzi: "不", pinyin: "bù", meaning: "아니다, ~하지 않다" },
    { hanzi: "人", pinyin: "rén", meaning: "사람" },
    { hanzi: "爱", pinyin: "ài", meaning: "사랑하다" },
    { hanzi: "吃", pinyin: "chī", meaning: "먹다" },
    { hanzi: "喝", pinyin: "hē", meaning: "마시다" },
    { hanzi: "水", pinyin: "shuǐ", meaning: "물" },
    { hanzi: "吗", pinyin: "ma", meaning: "~까? (의문 조사)" },
    { hanzi: "谢谢", pinyin: "xièxie", meaning: "고맙습니다" },
    { hanzi: "再见", pinyin: "zàijiàn", meaning: "안녕히 가세요(또 만나요)" },
    { hanzi: "学生", pinyin: "xuéshēng", meaning: "학생" },
    { hanzi: "老师", pinyin: "lǎoshī", meaning: "선생님" },
    { hanzi: "中国", pinyin: "Zhōngguó", meaning: "중국" },
    { hanzi: "今天", pinyin: "jīntiān", meaning: "오늘" },
    { hanzi: "朋友", pinyin: "péngyou", meaning: "친구" },
    { hanzi: "喜欢", pinyin: "xǐhuan", meaning: "좋아하다" }
  ];

  let index = 0;
  let flipped = false;
  let filterMode = false;
  const difficult = new Set();

  const card = document.getElementById("card");
  const hanziEl = document.getElementById("hanzi");
  const pinyinEl = document.getElementById("pinyin");
  const meaningEl = document.getElementById("meaning");
  const counterEl = document.getElementById("counter");
  const starBadge = document.getElementById("starBadge");
  const markBtn = document.getElementById("markBtn");
  const filterBtn = document.getElementById("filterBtn");

  function activeList() {
    return filterMode ? words.filter(w => difficult.has(w.hanzi)) : words;
  }

  function render() {
    const list = activeList();

    if (list.length === 0) {
      hanziEl.textContent = "🎉";
      pinyinEl.textContent = "";
      meaningEl.textContent = "어려운 카드가 없어요!";
      counterEl.textContent = "0 / 0";
      starBadge.classList.remove("show");
      markBtn.disabled = true;
      return;
    }

    markBtn.disabled = false;
    if (index >= list.length) index = list.length - 1;
    if (index < 0) index = 0;

    const word = list[index];
    hanziEl.textContent = word.hanzi;
    pinyinEl.textContent = word.pinyin;
    meaningEl.textContent = word.meaning;
    counterEl.textContent = `${index + 1} / ${list.length}`;

    const isDifficult = difficult.has(word.hanzi);
    starBadge.classList.toggle("show", isDifficult);
    markBtn.classList.toggle("active", isDifficult);
    markBtn.textContent = isDifficult ? "★ 어려움" : "☆ 어려워요";
  }

  function setFlipped(state) {
    flipped = state;
    card.classList.toggle("flipped", flipped);
  }

  function goPrev() {
    const list = activeList();
    if (list.length === 0) return;
    index = (index - 1 + list.length) % list.length;
    setFlipped(false);
    render();
  }

  function goNext() {
    const list = activeList();
    if (list.length === 0) return;
    index = (index + 1) % list.length;
    setFlipped(false);
    render();
  }

  function toggleDifficult() {
    const list = activeList();
    if (list.length === 0) return;
    const word = list[index];
    if (difficult.has(word.hanzi)) {
      difficult.delete(word.hanzi);
    } else {
      difficult.add(word.hanzi);
    }
    render();
  }

  function toggleFilterMode() {
    filterMode = !filterMode;
    filterBtn.classList.toggle("active", filterMode);
    filterBtn.textContent = filterMode ? "전체 카드 보기" : "⭐ 어려운 카드만";
    index = 0;
    setFlipped(false);
    render();
  }

  card.addEventListener("click", () => {
    setFlipped(!flipped);
  });

  document.getElementById("flipBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    setFlipped(!flipped);
  });

  document.getElementById("prevBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    goPrev();
  });

  document.getElementById("nextBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    goNext();
  });

  markBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleDifficult();
  });

  filterBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleFilterMode();
  });

  function shuffleWords() {
    for (let i = words.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [words[i], words[j]] = [words[j], words[i]];
    }
    index = 0;
    setFlipped(false);
    render();
  }

  document.getElementById("shuffleBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    shuffleWords();
  });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      setFlipped(!flipped);
    } else if (e.code === "ArrowLeft") {
      e.preventDefault();
      goPrev();
    } else if (e.code === "ArrowRight") {
      e.preventDefault();
      goNext();
    }
  });

  render();
</script>

</body>
</html>
